# pytest on every push and pull request. The model files are not in git, so the engine runs on its fallback
# rules here; the trained pair is checked on the LinuxONE server (safenet/tests/test_models.py).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: safenet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: safenet/requirements/*.txt
      - name: Install (the server's versions of the scientific stack)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt scikit-learn==1.4.1.post1 numpy==1.26.4 scipy==1.11.4 joblib==1.3.2 pandas==2.1.4
      - name: JSON schemas are up to date
        run: python scripts/export_schemas.py && git diff --exit-code -- schemas
      - name: Tests
        run: python -m pytest -q
